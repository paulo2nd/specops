schema_version: "1.0"
workflow:
  id: "specops"
  name: "SpecOps Augmented Lifecycle"
  version: "1.0.0"
  author: "SpecOps"
  description: >
    Runs the full Spec Kit lifecycle with SpecOps deterministic gates and a human
    planning-readiness gate. Composes Spec Kit native steps only — SpecOps adds no
    engine, resume, gate, or loop (Feature 007). Forward-seam ledger transitions are
    owned by the injected SpecOps directives that fire on the lifecycle commands; this
    definition adds the readiness gate, optional-step skip gates, the deterministic
    review, and the final DONE transition.

requires:
  speckit_version: ">=0.8.5"
  integrations:
    any:
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use ('auto' uses the project's initialized integration)"

steps:
  # --- Specify ---------------------------------------------------------------
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # --- Optional: Clarify (human-decided skip; the decision is recorded after the
  #     tasks step — see clarify-record below) --------------------------------
  - id: clarify-gate
    type: gate
    message: "Run /speckit.clarify for this feature? Choose 'run' or 'skip'."
    options: [run, skip]
  - id: clarify
    type: if
    condition: "{{ steps.clarify-gate.output.choice == 'run' }}"
    then:
      - id: clarify-run
        command: speckit.clarify
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.spec }}"

  # --- Optional: Checklist (decision recorded after tasks — checklist-record) --
  - id: checklist-gate
    type: gate
    message: "Run /speckit.checklist for this feature? Choose 'run' or 'skip'."
    options: [run, skip]
  - id: checklist
    type: if
    condition: "{{ steps.checklist-gate.output.choice == 'run' }}"
    then:
      - id: checklist-run
        command: speckit.checklist
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.spec }}"

  # --- Plan ------------------------------------------------------------------
  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # --- Human planning-readiness gate (FR-004): no tasks until approved --------
  - id: readiness-gate
    type: gate
    message: "Approve spec.md and plan.md before generating tasks?"
    options: [approve, reject]
    on_reject: abort

  # --- Tasks -----------------------------------------------------------------
  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # --- Record the optional-step decisions (issue #50) --------------------------
  # `specops status record-step` writes to the ledger, which the after_tasks
  # directive creates during the tasks step. Recording therefore happens here,
  # after tasks — the gates above stay where the human actually decides; only
  # the bookkeeping is deferred. The engine retains earlier step outputs, so
  # the gate choices remain addressable.
  - id: clarify-record
    type: shell
    run: "specops status record-step clarify --decision {{ steps.clarify-gate.output.choice }}"
  - id: checklist-record
    type: shell
    run: "specops status record-step checklist --decision {{ steps.checklist-gate.output.choice }}"

  # --- Optional: Analyze -----------------------------------------------------
  - id: analyze-gate
    type: gate
    message: "Run /speckit.analyze for this feature? Choose 'run' or 'skip'."
    options: [run, skip]
  - id: analyze-record
    type: shell
    run: "specops status record-step analyze --decision {{ steps.analyze-gate.output.choice }}"
  - id: analyze
    type: if
    condition: "{{ steps.analyze-gate.output.choice == 'run' }}"
    then:
      - id: analyze-run
        command: speckit.analyze
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.spec }}"

  # --- Corrective loop: implement → review, repeating while REJECTED ----------
  # Native `do-while` (FR-015): SpecOps builds no loop. Each round runs, in order:
  #   1. `reconcile --json` — fail-closed precondition (FR-010) of the corrective
  #      transition.
  #   2. `implement` — the lifecycle command.
  #   3. `review-soft` (`specops preflight --json --soft`) — the DETERMINISTIC gate,
  #      kept as the cheap fail-closed PRECONDITION (Feature 016 FR-002, Principle
  #      IV §18 token discipline). `--soft` always exits 0 (verdict in JSON) so a
  #      REJECTED verdict DRIVES the loop instead of aborting the run.
  #   4. `semantic-review` (`command: specops.review`) — the SEMANTIC agent review
  #      (Feature 016 FR-001), run ONLY when the mechanical gate passes. It reads
  #      the effective diff, records structured findings (Feature 011), verifies
  #      fixed ones, and executes its OWN owned outcome transition (DONE on
  #      approval / IMPLEMENT -r REJECTED on a blocking finding) — this feature
  #      adds no transition of its own (FR-009). It is a HARD command step: if the
  #      review command is unavailable the engine aborts the run (fail closed,
  #      FR-016) — it is never treated as a no-findings degrade.
  #   5. `handoff-report` (`specops handoff report --json`) — read-only; exposes
  #      `remaining_blocking` (the unverified blocking finding ids, Feature 011)
  #      to the loop condition (FR-003/FR-008). No handoff-CLI change.
  # The loop re-iterates while the mechanical verdict is REJECTED OR any blocking
  # finding is unverified. An empty `remaining_blocking` (no findings / legacy
  # repo) leaves completion to the mechanical verdict — automatic degrade
  # (FR-006/FR-015, no config toggle). On a MECHANICAL reject the workflow opens a
  # corrective round (REVIEW→IMPLEMENT -r REJECTED — a transition no directive
  # owns, C1/FR-017) and skips the semantic review that round; `max_iterations`
  # bounds the loop.
  #
  # NOTE (runtime verification): the loop's end-to-end behavior interacts with the
  # injected Principle IV directive transitions and requires a live integration to
  # validate — it is not CI-reproducible (command steps need an agent/LLM). The
  # step structure is verified against Spec Kit's engine; the CLI primitives it
  # composes (soft/hard review, semantic review, handoff report, terminal
  # blocking-approval gate, corrective transition) are unit/integration-tested.
  - id: corrective-loop
    type: do-while
    condition: "{{ steps.review-soft.output.data.verdict == 'REJECTED' or steps.handoff-report.output.data.remaining_blocking }}"
    max_iterations: 3
    steps:
      - id: reconcile-pre-impl
        type: shell
        run: "specops reconcile --json"
      - id: implement
        command: speckit.implement
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.spec }}"
      - id: review-soft
        type: shell
        run: "specops preflight --json --soft"
        output_format: json
      # Semantic agent review — only when the mechanical gate passes (FR-002).
      - id: semantic-review-round
        type: if
        condition: "{{ steps.review-soft.output.data.verdict != 'REJECTED' }}"
        then:
          - id: semantic-review
            command: specops.review
            integration: "{{ inputs.integration }}"
            input:
              args: "{{ inputs.spec }}"
      # Findings-aware signal for the loop condition (read-only; FR-003/FR-008).
      - id: handoff-report
        type: shell
        run: "specops handoff report --json"
        output_format: json
      - id: corrective-round
        type: if
        condition: "{{ steps.review-soft.output.data.verdict == 'REJECTED' }}"
        then:
          - id: open-corrective-round
            type: shell
            run: "specops status transition-phase IMPLEMENT -r REJECTED --if-needed"

  # --- Terminal deterministic gate (FR-019): fail closed if not APPROVED ------
  # A hard `specops preflight` exits non-zero when the verdict is not APPROVED, so an
  # exhausted-loop still-rejecting feature halts here and never reaches DONE. This
  # is NOT a human gate (a human approve could bypass a still-failing review).
  - id: terminal-gate
    type: shell
    run: "specops preflight"

  # --- Completion: workflow-owned final transition (idempotent-tolerant) ------
  - id: done
    type: shell
    run: "specops status transition-phase DONE -r APPROVED --if-needed"
