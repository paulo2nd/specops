[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speckit-specops"
version = "0.12.0"
description = "A Spec-Driven Development (SDD) process enforcement CLI extending Speckit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Paulo Segundo", email = "paulosegundo@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "packaging>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/paulo2nd/specops"
Changelog = "https://github.com/paulo2nd/specops/blob/main/CHANGELOG.md"
Issues = "https://github.com/paulo2nd/specops/issues"

[project.scripts]
specops = "specops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/specops"]

[tool.hatch.build]
include = [
    "src/specops/**",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
# Typer's option/argument factories are the idiomatic default for CLI params
# (e.g. a repeatable `list[str] = typer.Option(None, ...)`); they are not the
# mutable-default-argument trap B008 targets.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["tests/"]

[tool.pytest.ini_options]
addopts = "--cov=specops --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
markers = [
    "subprocess: end-to-end smoke tests that spawn the real `specops` binary (one per command family) to cover true exit codes, stream separation, and console encoding that the in-process CliRunner path cannot (Feature 018 US4).",
]
