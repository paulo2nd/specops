name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate release tag against pyproject version
        env:
          TAG: ${{ github.event.release.tag_name }}
        # Publishing to PyPI is irreversible; refuse to build a release whose
        # tag (e.g. v0.6.0) does not match the version pyproject.toml declares.
        run: |
          python - <<'EOF'
          import os, sys, tomllib

          tag = os.environ["TAG"]
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          if tag.removeprefix("v") != version:
              sys.exit(f"Release tag '{tag}' does not match pyproject.toml version '{version}'.")
          print(f"Release tag '{tag}' matches pyproject.toml version '{version}'.")
          EOF

      - name: Build and smoke-test distribution
        uses: ./.github/actions/package-smoke

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/speckit-specops/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) — no stored API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
